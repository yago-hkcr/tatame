<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tatame · monte seu treino de judô, execute com timer de tatame e acompanhe sua evolução.">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tatame · Treino de Judô</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/inter-tight-0.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jbmono-0.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css?v=2.6.5">
<link rel="stylesheet" href="styles.css?v=2.6.5">
<link rel="stylesheet" href="adaptive.css?v=2.6.5">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <div class="noise"></div>
</div>

<header class="topbar">
  <a class="brand" href="#" data-action="nav" data-view="treinar" aria-label="Tatame, início">
    <span class="brand-mark">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="bgold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8e3a6"/>
            <stop offset="55%" stop-color="#e8c063"/>
            <stop offset="100%" stop-color="#b8863a"/>
          </linearGradient>
        </defs>
        <rect x="1.2" y="1.2" width="37.6" height="37.6" rx="11" fill="none" stroke="url(#bgold)" stroke-width="1.6" opacity=".7"/>
        <path d="M12.5 13.2h15M20 13.2v13.4M14.6 26.6h10.8" fill="none" stroke="url(#bgold)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="20" cy="10.2" r="2.5" fill="url(#bgold)"/>
      </svg>
    </span>
    <span class="brand-text">
      <strong>Tatame</strong>
      <span>treino de judô</span>
    </span>
  </a>

  <div class="topbar-side">
    <button class="streak" data-action="nav" data-view="progresso" aria-label="Sua sequência de treinos">
      <span class="streak-ico">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2.6c.3 3.1 2.6 4.1 3.9 6.1a6.6 6.6 0 01-2.1 9.2 6.4 6.4 0 01-9-2.2c-.9-1.5-1-3.4-.3-5 1 1 1.7 1.3 2.5 1.2-.7-3.4.9-6.4 5-9.3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M11.4 13.2c1.8.5 2.7 1.5 2.5 3.2-.2 1.5-1.4 2.4-2.9 2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/></svg>
      </span>
      <span class="streak-body">
        <b id="topbar-streak">0</b>
        <span id="streak-unit">dias</span>
      </span>
    </button>
    <button class="avatar" id="topbar-avatar" data-action="perfil" aria-label="Seu perfil e sua chave">T</button>
  </div>
</header>

<div id="gate" class="gate" hidden></div>

<main id="view" class="view" aria-live="polite"></main>

<nav class="tabbar" aria-label="Navegação principal">
  <span class="tab-ink" id="tab-ink" aria-hidden="true"></span>
  <button class="tab is-active" data-action="nav" data-view="treinar">
    <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.2 8.7l5.4 3.3-5.4 3.3z" fill="currentColor"/></svg></span>
    <span class="tab-label">Treinar</span>
  </button>
  <button class="tab" data-action="nav" data-view="treinos">
    <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M4.5 12h15M4.5 17h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="18.6" cy="17" r="1.5" fill="currentColor"/></svg></span>
    <span class="tab-label">Treinos</span>
  </button>
  <button class="tab" data-action="nav" data-view="tecnicas">
    <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4.8A1.8 1.8 0 017.3 3H18a1 1 0 011 1v16a1 1 0 01-1 1H7.3a1.8 1.8 0 01-1.8-1.8z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 8h6M9 12h6M9 16h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    <span class="tab-label">Técnicas</span>
  </button>
  <button class="tab" data-action="nav" data-view="progresso">
    <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V11M9.4 19.5V5M14.8 19.5v-6M20.2 19.5V8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
    <span class="tab-label">Progresso</span>
  </button>
      <span class="rail-foot">judo · treino diário</span>
    </nav>

<div id="player" class="player" hidden></div>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
<div id="sheet" class="sheet-layer" hidden></div>
<div id="toast" class="toast" role="status"></div>

<script src="data.js?v=2.6.5"></script>
<script src="app.js?v=2.6.5"></script>
</body>
</html>
